server:
  port: ${SERVER_PORT:8082}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/habitloop}
    username: ${DB_USER:habitloop}
    password: ${DB_PASSWORD:habitloop}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: activity_service
management:
  endpoints:
    web:
      exposure:
        include: health
